services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: papertrail
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: papertrail
    ports:
      - "807:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
